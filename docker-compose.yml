version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3005:3005"
    environment:
      - PORT=3005
      - DATABASE_URL=file:./prisma/medaxis.db
      - JWT_SECRET=medaxis-super-secret-key-2026
      - JWT_EXPIRES_IN=8h
      - NODE_ENV=production
      - ESIGNET_BASE_URL=http://localhost:8088
    volumes:
      - ./backend/prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js && node index.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3005/api
    depends_on:
      - backend
